<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NontonAnime - Portal Streaming</title>
    <!-- SCRIPT WAJIB DESAIN (JANGAN TERPOTONG) -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body class="bg-[#0f0f12] text-gray-100 font-sans min-h-screen">

    <!-- NAV BAR -->
    <nav class="bg-[#1e1e24] border-b border-gray-800 p-4 flex justify-between items-center">
        <a href="#" class="text-xl font-black text-[#ff4757] tracking-wider">
            <i class="fa-solid fa-play-circle mr-1"></i> NONTONANIME
        </a>
        <span class="bg-green-500/20 text-green-400 text-xs font-bold px-2 py-1 rounded">SERVER ONLINE</span>
    </nav>

    <!-- CONTAINER UTAMA -->
    <main class="p-4 space-y-6 max-w-4xl mx-auto">

        <!-- PEMUTAR VIDEO INTERAKTIF -->
        <section class="bg-[#1e1e24] p-4 rounded-xl border border-gray-800 shadow-xl space-y-4">
            <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden border border-gray-800">
                <iframe id="main-player" class="w-full h-full" src="https://youtube.com" frameborder="0" allowfullscreen></iframe>
            </div>
            <div>
                <h1 id="video-title" class="text-lg font-bold text-white">Demon Slayer: Kimetsu no Yaiba - Episode 01</h1>
                <p class="text-xs text-gray-400 mt-1">Status: <span class="text-green-400">Ongoing</span> | Sub: Indo</p>
            </div>
        </section>

        <!-- DAFTAR EPISODE -->
        <section class="space-y-3">
            <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider"><i class="fa-solid fa-list text-[#ff4757] mr-2"></i>Pilih Episode:</h3>
            <div class="grid grid-cols-1 gap-2">
                <button onclick="putar('Demon Slayer: Kimetsu no Yaiba - Episode 01', 'https://youtube.com')" class="w-full text-left bg-[#ff4757] text-white p-3 rounded-lg text-xs font-bold flex justify-between items-center">
                    <span>Eps 01: Perjalanan Dimulai</span>
                    <i class="fa-solid fa-circle-play"></i>
                </button>
                <button onclick="putar('Demon Slayer: Kimetsu no Yaiba - Episode 02', 'https://youtube.com')" class="w-full text-left bg-[#1e1e24] text-gray-300 p-3 rounded-lg text-xs font-bold flex justify-between items-center border border-gray-800">
                    <span>Eps 02: Pelatih Sakonji</span>
                    <i class="fa-regular fa-circle-play text-gray-500"></i>
                </button>
            </div>
        </section>

    </main>

    <!-- JAVASCRIPT SYSTEM -->
    <script>
        function putar(judul, linkVideo) {
            document.getElementById('video-title').innerText = judul;
            document.getElementById('main-player').src = linkVideo;
        }
    </script>
</body>
</html>
