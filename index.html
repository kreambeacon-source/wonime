<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wonime Stream</title>

  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.5rem;
      color: #38bdf8;
    }
    main {
      flex: 1;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .welcome-card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
      border: 1px solid #334155;
    }
    .welcome-card h2 {
      margin-bottom: 1rem;
      color: #f1f5f9;
    }
    .welcome-card p {
      color: #94a3b8;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #1d4ed8;
    }
    footer {
      background-color: #0f172a;
      border-top: 1px solid #1e293b;
      text-align: center;
      padding: 1rem;
      font-size: 0.875rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <header>
    <h1>Wonime Stream</h1>
  </header>

  <main>
    <div class="welcome-card">
      <h2>Selamat Datang di Wonime Stream</h2>
      <p>Aplikasi streaming anime cepat, praktis, dan ramah pengguna.</p>
      <a href="#" class="btn">Mulai Jelajah</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Wonime Stream. All rights reserved.
  </footer>

</body>
</html>
