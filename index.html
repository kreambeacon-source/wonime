<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NontonAnime - Portal Streaming</title>
    <!-- GAYA DESAIN INTERNAL - ANTI GAGAL LOAD -->
    <style>
        body { background-color: #0f0f12; color: #f3f4f6; font-family: sans-serif; margin: 0; padding: 0; }
        nav { background-color: #1e1e24; padding: 15px; border-b: 1px solid #2d3748; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #ff4757; font-weight: 900; font-size: 20px; text-decoration: none; letter-spacing: 1px; }
        .badge { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 11px; font-weight: bold; padding: 4px 8px; rounded: 4px; border-radius: 4px; }
        .container { padding: 15px; max-width: 800px; margin: 0 auto; }
        .player-box { background-color: #1e1e24; padding: 15px; border-radius: 12px; border: 1px solid #2d3748; margin-bottom: 20px; }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 8px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .judul { font-size: 18px; font-weight: bold; margin-top: 12px; margin-bottom: 4px; color: #fff; }
        .sub-judul { font-size: 12px; color: #9ca3af; margin: 0; }
        .btn-eps { width: 100%; text-align: left; background-color: #ff4757; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; }
        .btn-eps-off { width: 100%; text-align: left; background-color: #1e1e24; color: #d1d5db; padding: 12px; border: 1px solid #2d3748; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; }
        .genre-box { background-color: #1e1e24; padding: 10px 15px; border-radius: 8px; display: inline-block; margin-right: 8px; margin-bottom: 8px; font-size: 12px; font-weight: bold; border: 1px solid #2d3748; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">▶ NONTONANIME</a>
        <span class="badge">SERVER ONLINE</span>
    </nav>

    <div class="container">
        <!-- PLAYER -->
        <div class="player-box">
            <div class="video-wrapper">
                <iframe id="main-player" src="https://youtube.com" allowfullscreen></iframe>
            </div>
            <div class="judul" id="video-title">Demon Slayer: Kimetsu no Yaiba - Episode 01</div>
            <p class="sub-judul">Status: <span style="color:#4ade80">Ongoing</span> | Subtitle: Indonesia</p>
        </div>

        <!-- EPISODE -->
        <h3 style="font-size: 14px; color: #9ca3af; text-transform: uppercase;">Pilih Episode:</h3>
        <button onclick="putar('Demon Slayer: Kimetsu no Yaiba - Episode 01', 'https://youtube.com')" class="btn-eps">
            <span>Eps 01: Perjalanan Dimulai</span> <span>▶</span>
        </button>
        <button onclick="putar('Demon Slayer: Kimetsu no Yaiba - Episode 02', 'https://youtube.com')" class="btn-eps-off">
            <span>Eps 02: Pelatih Sakonji Urokodaki</span> <span>🔲</span>
        </button>

        <!-- GENRE -->
        <h3 style="font-size: 14px; color: #9ca3af; text-transform: uppercase; margin-top: 25px;">Genre Populer:</h3>
        <div class="genre-box">⚔️ Action</div>
        <div class="genre-box">🧙‍♂️ Isekai</div>
        <div class="genre-box">🤣 Comedy</div>
    </div>

    <script>
        function putar(judul, linkVideo) {
            document.getElementById('video-title').innerText = judul;
            document.getElementById('main-player').src = linkVideo;
        }
    </script>
</body>
</html>
